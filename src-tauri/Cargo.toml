[package]
name = "fourutools"
version = "2.8.6"
description = "Android device management suite"
authors = ["ilpano"]
edition = "2021"
default-run = "fourutools"

[lib]
name = "fourutools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fourutools"
path = "src/main.rs"

[[bin]]
name = "build-battery-catalog"
path = "src/bin/build_battery_catalog.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
dirs = "6"
adb-bridge = { path = "../crates/adb-bridge" }
device-info = { path = "../crates/device-info" }
package-scanner = { path = "../crates/package-scanner" }
uninstall-engine = { path = "../crates/uninstall-engine" }
reputation-db = { path = "../crates/reputation-db" }
cloud-sync = { path = "../crates/cloud-sync" }
system-setup = { path = "../crates/system-setup" }
autobackup-core = { path = "../crates/autobackup-core" }
chrono = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
jpeg-decoder = { version = "0.3", features = ["rayon"] }
kamadak-exif = "0.6"
base64 = "0.22"
sha2 = "0.10"
uuid = { workspace = true }
cookie = "=0.18.1"
time = "0.3"
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
