[package]
name = "fourutools"
version = "1.3.2"
description = "Android device management suite"
authors = ["ilpano"]
edition = "2021"
default-run = "fourutools"

[lib]
name = "fourutools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fourutools"
path = "src/main.rs"

[[bin]]
name = "build-battery-catalog"
path = "src/bin/build_battery_catalog.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
dirs = "6"
adb-bridge = { path = "../crates/adb-bridge" }
device-info = { path = "../crates/device-info" }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
