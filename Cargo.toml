[workspace]
members = [
    "src-tauri",
    "crates/adb-bridge",
    "crates/device-info",
    "crates/package-scanner",
    "crates/uninstall-engine",
    "crates/reputation-db",
    "crates/cloud-sync",
    "crates/system-setup",
    "crates/autobackup-core",
]
resolver = "2"

[workspace.package]
version = "2.8.8"
edition = "2021"

[patch.crates-io]
# shortcut: tao 0.35.4 non è su crates.io; il commit evita il blocco Windows su Alt-Tab. Togliere quando Tauri porta un tao che include il fix.
tao = { git = "https://github.com/tauri-apps/tao.git", rev = "c704261c519c58cfdd0bc2d58ba24e06a0b71c92" }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
dirs = "6"
base64 = "0.22"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
