<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Foto — Chrome</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1a1a;
        color: #e8e8e8;
        padding: 2rem;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
      p { font-size: 0.95rem; line-height: 1.5; color: #aaa; margin: 0 0 1rem; }
      .hint {
        font-size: 0.85rem;
        color: #888;
        border-top: 1px solid #333;
        padding-top: 1rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Google Foto in Chrome</h1>
      <p>
        Per il login Google, l'app apre <strong>Chrome</strong> in una finestra separata
        (non il browser integrato, che Google blocca).
      </p>
      <p>Accedi a Google Foto lì, poi usa il pannello a destra per avviare la selezione.</p>
      <p class="hint">Il profilo Chrome è temporaneo: alla chiusura dell'app dovrai rifare il login.</p>
    </div>
  </body>
</html>
