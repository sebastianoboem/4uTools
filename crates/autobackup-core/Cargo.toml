[package]
name = "autobackup-core"
version.workspace = true
edition.workspace = true

[dependencies]
dirs = "6"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
thiserror = "2"
adb-bridge = { path = "../adb-bridge" }
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
